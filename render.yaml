services:
  - type: web
    name: golden-knot-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn goldenknot.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60
    plan: free
    region: singapore

    envVars:
      # ── Required — set these in the Render dashboard ──────────────────────
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value

      - key: DATABASE_URL
        sync: false                  # paste your Supabase connection string

      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # e.g. https://golden-knot.vercel.app

      # ── Cloudinary (required if USE_CLOUDINARY=True) ──────────────────────
      - key: USE_CLOUDINARY
        value: "True"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Defaults (safe to leave as-is) ────────────────────────────────────
      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"

      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
